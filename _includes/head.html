{%- assign page_title = include.title | default: site.title -%}
{%- assign page_desc = include.description | default: site.description | strip_html | strip_newlines | truncate: 200 -%}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title | escape }}</title>
  <meta name="description" content="{{ page_desc | escape }}">
  <meta name="theme-color" content="#0B0A08">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="{{ include.type | default: 'website' }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_desc | escape }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@great_caster">

  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>document.documentElement.classList.add("js");</script>
